[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "frontend", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# UP042: keep `str, Enum` rather than StrEnum (avoids changing pydantic serialization).
# B008: FastAPI's Depends()/Body() in argument defaults is the intended pattern.
ignore = ["E741", "UP042", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # env must be set before backend import in conftest
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
exclude = ['^frontend/', '^\.venv/']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
