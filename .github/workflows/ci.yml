name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      RETRIEVAL_PROVIDER: local  # CI runs the offline provider only — no Azure secrets.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Lint (ruff)
        run: ruff check backend scripts tests
      - name: Type-check (mypy)
        run: mypy backend
      - name: Unit + e2e tests
        run: pytest
      - name: Evaluation scorecard (curated + held-out + grounding-gate benchmark; hard-gated)
        run: python -m scripts.score

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build
